apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-taint
  labels:
    purpose: taint
    environment: dev
  namespace: roboshop
spec:
  # Specify replicas to be created
  replicas: 2
  selector:
    matchLabels:
      purpose: taint
      environment: dev
  template:
    # pod definition
    metadata:
      labels:
        purpose: taint
        environment: dev
    spec:
      containers:
        - name: nginx
          image: nginx:alpine

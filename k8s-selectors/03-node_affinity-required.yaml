apiVersion: v1
kind: Pod
metadata:
  name: pod-test
  # namespace: roboshop
spec:
  # Specify replicas to be created
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: alpha.eksctl.io/cluster-name
                operator: In
                values:
                  - roboshop-dev
              - key: app
                operator: In
                values:
                  - affinity
  containers:
    - name: nginx
      image: nginx:alpine

apiVersion: v1
kind: Service
metadata:
  name: service-lb
  namespace: roboshop
spec:
  type: LoadBalancer
  selector:
    project: roboshop
    component: frontend
    environment: dev
    purpose: LoadBalancer
  ports:
    - protocol: TCP
      port: 80 #servicePort
      targetPort: 80 #containerPort
      nodePort: 32115

apiVersion: v1
kind: Pod
metadata:
  name: env-test
  namespace: roboshop
  labels:
    project: roboshop
    environment: dev
    component: env
spec:
  containers:
    - name: nginx
      image: nginx
      resources:
        requests:
          memory: "68Mi"
          cpu: "100m"
        limits:
          memory: "100Mi"
          cpu: "120m"
      ports:
        - containerPort: 80
      env:
        - name: course
          value: k8s
        - name: practice
          value: aws

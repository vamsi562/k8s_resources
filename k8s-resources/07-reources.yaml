apiVersion: v1
kind: Pod
metadata:
  name: resources-test
  namespace: roboshop
  labels:
    project: roboshop
    environment: dev
    component: resources
spec:
  containers:
    - name: nginx
      image: nginx
      resources:
        requests:
          memory: "68Mi"
          cpu: "100m"
        limits:
          memory: "100Mi"
          cpu: "120m"
      ports:
        - containerPort: 80

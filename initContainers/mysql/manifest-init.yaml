apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql
data:
  my.cnf: |
    [mysqld]
    # NOTE: Since you are running on a t3.micro node (1GB RAM Max), 
    # a 2G redo log will cause an instant Out-Of-Memory (OOM) kernel crash.
    # We highly recommend lowering this value during your development phase.
    innodb_redo_log_capacity = 64M
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  labels:
    purpose: roboshop
    component: mysql
    tier: db
spec:
  replicas: 1
  selector:
    matchLabels:
      purpose: roboshop
      component: mysql
      tier: db
  template:
    metadata:
      labels:
        purpose: roboshop
        component: mysql
        tier: db
    spec:
      serviceAccountName: secret-mysql-reader
      securityContext:
        fsGroup: 999 # FIXED: Grants the non-root mysql daemon process read access to the volume mount
      initContainers:
        - name: fetch-secret
          image: amazon/aws-cli
          command:
            - sh
            - -c
            - |
              # FIXED: Fetch raw secret JSON payload string from SSM/Secrets Manager
              RAW_SECRET=$(aws secretsmanager get-secret-value --secret-id dev/roboshop/mysqlpassword --query 'SecretString' --output text)

              # FIXED: Replaced missing 'jq' tool with native python built inside the aws-cli image
              # Writes the token cleanly to the SHARED staging mount path directory
              echo "$RAW_SECRET" | python3 -c "import sys, json; print(json.load(sys.stdin)['mysqlpassword'])" > /mysql-secret-shared/mysql-root-password.txt
          volumeMounts:
            - name: mysql-secret-volume
              mountPath: /mysql-secret-shared # FIXED: Aligned output directory with the bound volume path location
      containers:
        - name: mysql
          image: vamsi562/mysql:v2
          imagePullPolicy: Always
          # FIXED: Injected an inline command wrapper to stage a standard writable file copy
          # This completely bypasses the subpath read-only lockout so your script can delete it cleanly!
          command: ["sh", "-c"]
          args:
            - |
              mkdir -p /tmp
              cp /mysql-secret-shared/mysql-root-password.txt /tmp/mysql-root-password.txt
              exec /usr/local/bin/custom_script.sh
          volumeMounts:
            - name: mysql-config
              mountPath: /etc/mysql/conf.d/my.cnf
              subPath: my.cnf
            - name: mysql-secret-volume
              mountPath: /mysql-secret-shared # Mounts the clear shared staging volume directory path
      volumes:
        - name: mysql-config
          configMap:
            name: mysql
        - name: mysql-secret-volume
          emptyDir: {}

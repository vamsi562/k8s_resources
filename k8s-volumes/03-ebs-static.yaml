apiVersion: v1
kind: PersistentVolume
metadata:
  name: test-ebs-static
spec:
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  capacity:
    storage: 50Gi
  csi:
    driver: ebs.csi.aws.com
    fsType: ext4
    volumeHandle: vol-094fa51a1d5c9fb5c

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: test-ebs-static-pvc
spec:
  storageClassName: "" # Empty string must be explicitly set otherwise default StorageClass will be set
  volumeName: test-ebs-static
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
